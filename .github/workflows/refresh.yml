name: Refresh catalog

# Vercel hosts the site and redeploys on every push to main, so this workflow only
# validates inputs and refreshes the data; it never deploys anything itself.
on:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ['curation/**', 'guides/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate curation and guides
        run: node scripts/validate.mjs

  refresh:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harvest, enrich, score, build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run all
      - name: Commit refreshed data (Vercel deploys the push)
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site curation
          git diff --cached --quiet && exit 0
          git commit -m "Refresh catalog data ($(date -u +%F))"
          git push
